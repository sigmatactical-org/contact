[workspace]
members = [".", "nav"]
resolver = "2"

[package]


name = "sigma-contact"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "MIT OR Apache-2.0"
authors = ["Sigma Tactical Group contributors <https://github.com/sigmatactical-org>"]
homepage = "https://sigmatactical.org"
description = "Contact directory for Sigma Tactical Group — identity users and external contacts"
publish = false

[dependencies]
askama = "0.16.0"
anyhow = "1.0.103"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sigma-config = { git = "https://github.com/sigmatactical-org/config.git", rev = "e66ad4ed16f248b7235c149bec8bba279c7414d2" }
sigma-theme = { git = "https://github.com/sigmatactical-org/sigma-theme.git", rev = "8419ea6a03fbb808f9dc50f02e8711cac9e67318", default-features = false, features = ["askama", "warp"] }
sigma-identity-nav = { git = "https://github.com/sigmatactical-org/identity.git", rev = "0116f54a1aac8c71bcc1d7dfe92df1dd6d8a2371", package = "sigma-identity-nav" }
sigma-human-check = { git = "https://github.com/sigmatactical-org/human-check.git", rev = "068e888a8e4346d663761814d8303c52f5b0301c", features = ["warp"] }
sigma-pg = { git = "https://github.com/sigmatactical-org/sigma-pg.git", rev = "532a31e1d0f9084b8eb8dc51083a5e6899df1b40" }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"
uuid = { version = "1.23.5", features = ["v4", "serde"] }
warp = { version = "0.4.3", features = ["server", "test"] }

[dev-dependencies]
temp-env = "0.3.6"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
